name: Release

# Tag push → per-platform single-file binaries, each smoke-tested with the
# full CLI-integration suite (the harness's RUBBER_DUCKY_TEST_BINARY switch,
# same as ci.yml's test-binary job) before anything is published. The release
# job only runs after every platform passes, so a failed smoke test on any
# platform means no assets are published. GitHub tags + Releases are the only
# distribution channel — no npm publishing.
#
# Integrity chain (docs/adr/plugin-binary-bootstrap.md): the release job
# computes sha256 for every binary, commits them to main in
# .claude-plugin/checksums.json BEFORE publishing any asset, and attests
# build provenance. The bootstrap wrapper refuses to run a download whose
# hash doesn't match the git-shipped checksum.

on:
  push:
    tags: ["v*"]

# Default every job to read-only; only the release job below gets the write
# scopes it needs.
permissions:
  contents: read

jobs:
  # The embedded version comes from a static package.json import at compile
  # time, so tag and package.json must agree before we build anything.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(jq -r .version package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}" >&2
            exit 1
          fi

  # Build and smoke-test natively on each platform. Cross-compiling would be
  # cheaper, but a binary we can't execute is a binary we can't smoke-test —
  # so each target builds on a runner that can run it.
  build-and-smoke-test:
    needs: verify-version
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            artifact: rubber-ducky-linux-x64
          - target: bun-darwin-arm64
            runner: macos-14
            artifact: rubber-ducky-darwin-arm64
          - target: bun-darwin-x64
            runner: macos-15-intel
            artifact: rubber-ducky-darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compile binary
        run: bun build --compile --target=${{ matrix.target }} src/cli.ts --outfile dist/${{ matrix.artifact }}
      - name: Verify binary reports the tagged version
        run: |
          reported="$(./dist/${{ matrix.artifact }} --version)"
          if [ "v${reported}" != "${GITHUB_REF_NAME}" ]; then
            echo "Binary reports v${reported}, expected ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Smoke test (full suite against the compiled binary)
        run: bun test
        env:
          RUBBER_DUCKY_TEST_BINARY: ${{ github.workspace }}/dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  # Runs only when every matrix job above passed — this is the gate that
  # keeps assets unpublished if any smoke test fails.
  release:
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push checksum commit to main + create the release
      id-token: write # provenance attestation (Sigstore)
      attestations: write # provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # Checksums travel via git, not via the (mutable) release assets: the
      # bootstrap wrapper only trusts hashes shipped inside the plugin
      # directory. Commit them BEFORE any asset is published so no asset ever
      # exists without its pinned hash on main. If this commit cannot land,
      # the whole release fails — no unverifiable release can exist.
      - name: Commit checksums for ${{ github.ref_name }} to main
        run: |
          set -eu
          tmp="$(mktemp)"
          cp .claude-plugin/checksums.json "$tmp"
          for f in dist/*; do
            name="$(basename "$f")"
            platform="${name#rubber-ducky-}"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            jq --arg key "${GITHUB_REF_NAME}/${platform}" --arg sha "$sha" \
              '.[$key] = $sha' "$tmp" > "${tmp}.next"
            mv "${tmp}.next" "$tmp"
          done
          mv "$tmp" .claude-plugin/checksums.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/checksums.json
          git commit -m "Pin binary checksums for ${GITHUB_REF_NAME}"
          # Retry once behind a rebase in case main moved during the build.
          git push origin main || { git pull --rebase origin main && git push origin main; }
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Create GitHub Release with binaries attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes
